<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d16">
  <meta name="description" content="Sagrum_ — video editor a content creator.">
  <title>Sagrum_ — Video editor</title>
  <link rel="preload" as="image" href="/Logo/Logo.png">
  <link rel="stylesheet" href="/style/style.css">
  <script src="/scripts/site.js" defer></script>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>

  <header class="site-header">
    <a class="brand" href="/" aria-label="Sagrum_ — domov">
      <img src="/Logo/Logo.png" alt="Sagrum_ logo">
    </a>
    <nav class="main-nav" aria-label="Hlavná navigácia">
      <a class="active" href="/">Domov</a>
      <a href="/info">Info</a>
      <a href="/portfolio">Portfólio</a>
      <a href="/clips">Clipy</a>
      <a href="/contact">Kontakt</a>
    </nav>
    <a class="header-cta" href="/contact">Kontaktovať <span aria-hidden="true">↗</span></a>
  </header>

  <main>
    <section class="home-hero" aria-labelledby="heroTitle">
      <div class="hero-glow" aria-hidden="true"></div>
      <img class="hero-logo-behind" src="/Logo/Logo.png" alt="" aria-hidden="true">
      <div class="hero-bubble">
        <h1 id="heroTitle">Sagrum_</h1>
      </div>
      <p class="hero-caption">VIDEO EDITOR <span>/</span> CONTENT CREATOR</p>
      <div class="hero-bottomline">
        <span>EDIT / CREATE</span>
        <span>SAGRUM_ © <span id="year"></span></span>
      </div>
    </section>

    <section class="home-intro page-shell reveal">
      <div>
        <p class="eyebrow"><span class="status-dot"></span> VIDEO EDITOR / CONTENT CREATOR</p>
        <h2>Tvoje zábery.<br><span>Môj strih.</span></h2>
      </div>
      <div class="intro-side">
        <p id="heroText" class="editable-copy"></p>
        <div class="intro-actions">
          <a class="button button-primary" href="/portfolio">Pozrieť portfólio <span>↗</span></a>
          <a class="text-link" href="/contact">Kontaktovať ma →</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer page-shell">
    <a class="footer-brand" href="/">SAGRUM<span>_</span></a>
    <span class="footer-note">MADE WITH INTENTION.</span>
    <a class="admin-entry" href="/admin">Admin ↗</a>
  </footer>
</body>
</html>
